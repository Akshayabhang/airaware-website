name: Build & Verify — AirWave

# This workflow runs on every push to main.
# It verifies the build works correctly.
#
# DEPLOYMENT: Hostinger's Managed Node.js (Plan 5) auto-deploys from GitHub
# when connected via hPanel → Websites → Node.js Apps → Import from GitHub.
# No SSH deploy job is needed here.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Create a .env so Next.js build can access the public API keys
      - name: Create build .env
        run: |
          echo "DATABASE_URL=file:./prisma/dev.db" >> .env
          echo "TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }}" >> .env
          echo "TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}" >> .env
          echo "WAQI_API_TOKEN=${{ secrets.WAQI_API_TOKEN }}" >> .env
          echo "NEXT_PUBLIC_WINDY_API_KEY=${{ secrets.NEXT_PUBLIC_WINDY_API_KEY }}" >> .env
          echo "INDIAN_WEATHER_API_KEY=${{ secrets.INDIAN_WEATHER_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_OWM_API_KEY=${{ secrets.NEXT_PUBLIC_OWM_API_KEY }}" >> .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build

      - name: Confirm standalone output exists
        run: ls -la .next/standalone/

      - name: Build passed ✅
        run: echo "Build successful — Hostinger will auto-deploy from this commit."
